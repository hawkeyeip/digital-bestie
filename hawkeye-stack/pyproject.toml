[project]
name = "hawkeye-agent-stack"
version = "1.0.0"
description = "Hawkeye Intelligence Agentic Stack — Local autonomous agent infrastructure with FastMCP headless browser, SQLite episodic memory, and Apple Silicon Metal acceleration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "hawkeyeip", email = "contact@hawkeyeip.ai"}
]

dependencies = [
    "mcp[cli]>=1.0.0",
    "playwright>=1.40.0",
    "openai>=1.10.0",
    "pymupdf>=1.23.0",
    "pandas>=2.1.0",
    "tiktoken>=0.5.0",
    "tabulate>=0.9.0",
    "requests>=2.31.0",
]

[project.scripts]
hawkeye-mcp = "mcp_server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["mcp_server.py"]

